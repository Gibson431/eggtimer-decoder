[project]
name = "eggtimer-decoder"
version = "0.1.0"
description = "Live decoder for Eggtimer/Eggfinder TX 2-FSK packets from an RTL-SDR or a simulated source"
authors = [
    { name = "Gibson431", email = "timmaxgibson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
eggtimer-decoder = "eggtimer_decoder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
gnuradio = "*"
numpy = "*"
gnuradio-osmosdr = "*"
rtl-sdr = "*"
pytest = "*"
pyside6 = ">=6.11.3,<7"

[tool.pixi.pypi-dependencies]
eggtimer-decoder = { path = ".", editable = true }

[tool.pixi.tasks]
decode = "eggtimer-decoder"
gui = "eggtimer-decoder"
sim = "eggtimer-decoder run --device sim --channel 0 --duration 10"
test = "pytest -q"
